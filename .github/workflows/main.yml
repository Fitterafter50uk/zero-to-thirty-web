name: Build Zero to Thirty

on:
  workflow_dispatch:

jobs:
  android:
    name: Build Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Android release
        working-directory: android
        run: ./gradlew app:bundleRelease

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: zero-to-thirty-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  ios:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build iOS archive
        working-directory: ios
        run: |
          xcodebuild \
            -workspace "Zero to Thirty.xcworkspace" \
            -scheme "Zero to Thirty" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/ZeroToThirty.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export iOS app
        run: |
          mkdir -p "$RUNNER_TEMP/ios-export"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/ZeroToThirty.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist ios/ExportOptions.plist \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: zero-to-thirty-ios
          path: ${{ runner.temp }}/ios-export/*
