name: Build Zero to Thirty

on:
  workflow_dispatch:

jobs:
  android:
    name: Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Android
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: zero-to-thirty-android
          path: android/app/build/outputs/bundle/release/*.aab

  ios:
    name: iOS Archive
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Find iOS workspace and scheme
        run: |
          WORKSPACE=$(find ios -maxdepth 3 -name "*.xcworkspace" | head -1)

          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace found"
            exit 1
          fi

          echo "Workspace: $WORKSPACE"

          xcodebuild -workspace "$WORKSPACE" -list

          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['workspace']['schemes'][0])")

          if [ -z "$SCHEME" ]; then
            echo "No Xcode scheme found"
            exit 1
          fi

          echo "Scheme: $SCHEME"

          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Build iOS
        run: |
          echo "Building workspace: $WORKSPACE"
          echo "Building scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/ZeroToThirty.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: zero-to-thirty-ios-archive
          path: ${{ runner.temp }}/ZeroToThirty.xcarchive
